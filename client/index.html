<!doctype html>
<html lang="en" class="dark" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2'><polyline points='16 18 22 12 16 6'/><polyline points='8 6 2 12 8 18'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveCode | Real-Time Collaborative Editor</title>

    <!-- Google Fonts: Plus Jakarta Sans (Headings), Inter (Body), JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Anti-Flash Inline Theme Initialization -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('livecode_theme') || 'midnight';
          document.documentElement.setAttribute('data-theme', savedTheme);
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-app-bg text-app-text antialiased font-sans select-none overflow-x-hidden">
    <div id="root" class="min-h-screen w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
